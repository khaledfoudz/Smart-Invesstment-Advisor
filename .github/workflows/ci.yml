name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [develop, feature/*]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Optional: cache Docker layers (faster builds later)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Backend
      - name: Build Backend Image
        run: docker build -t smia-backend ./backend

      # Build ML
      - name: Build ML Image
        run: docker build -t smia-ml ./backend/ml

      # Build Frontend
      - name: Build Frontend Image
        run: docker build -t smia-frontend .

      # Sanity check (containers run)
      - name: Test Backend Container
        run: docker run -d -p 4000:4000 smia-backend

      - name: Test ML Container
        run: docker run -d -p 8000:8000 smia-ml

      - name: Test Frontend Container
        run: docker run -d -p 3000:80 smia-frontend